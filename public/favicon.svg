<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Deep Space Dark Glow Radial Base -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0b122e" />
      <stop offset="100%" stop-color="#040612" />
    </radialGradient>

    <!-- Chrome Metallic Angel Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e0f2fe" />
      <stop offset="30%" stop-color="#38bdf8" />
      <stop offset="65%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Specular Highlight -->
    <linearGradient id="specularGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glowing Drop Shadow for Icon Depth -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Rounded Container -->
  <rect width="100" height="100" rx="24" fill="url(#bgGlow)" />

  <!-- Outer Cyan/Purple Soft Aura Ring -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="url(#chromeGrad)" stroke-width="1.5" opacity="0.3" />

  <!-- 3D Intertwined Trefoil Knot Emblem Path -->
  <g filter="url(#glow)" transform="translate(50,52) scale(0.95)">
    <!-- Trefoil Knot Path approximation -->
    <path 
      d="M 0,-32 C 18,-32 30,-12 30,5 C 30,22 12,32 0,18 C -12,32 -30,22 -30,5 C -30,-12 -18,-32 0,-32 Z M -18,-10 C -5,5 5,5 18,-10 M -18,10 C 0,25 0,25 18,10" 
      fill="none" 
      stroke="url(#chromeGrad)" 
      stroke-width="8.5" 
      stroke-linecap="round" 
      stroke-linejoin="round" 
    />
    <path 
      d="M 0,-32 C 18,-32 30,-12 30,5 C 30,22 12,32 0,18 C -12,32 -30,22 -30,5 C -30,-12 -18,-32 0,-32 Z" 
      fill="none" 
      stroke="url(#specularGrad)" 
      stroke-width="3" 
      stroke-linecap="round" 
    />
  </g>
</svg>
