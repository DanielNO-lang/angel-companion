"$schema" = "https://open-api.netlify.com/netlify.schema.json"

[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# GEMINI_MODEL is a non-secret model identifier, not a credential.
# Keep scanning enabled for all actual secrets, including GEMINI_API_KEY.
[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "GEMINI_MODEL"


[[redirects]]
  from = "/api/chat"
  to = "/.netlify/functions/chat"
  status = 200

[[redirects]]
  from = "/api/model/status"
  to = "/.netlify/functions/model-status"
  status = 200

[[redirects]]
  from = "/api/title"
  to = "/.netlify/functions/title"
  status = 200

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json; charset=utf-8"
    Cache-Control = "public, max-age=0, must-revalidate"

# Keep client-side public/auth routes and authenticated workspace routes refreshable.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
